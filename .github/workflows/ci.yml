name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  laravel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-laravel
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: refunds
          POSTGRES_PASSWORD: refunds
          POSTGRES_DB: refunds_laravel_test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U refunds" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, bcmath
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer analyse
      - run: composer test

  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: refunds
          POSTGRES_PASSWORD: refunds
          POSTGRES_DB: refunds_nest_test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U refunds" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:contracts
      - name: NestJS
        working-directory: apps/api-nest
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:e2e
      - name: Web
        working-directory: apps/web
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

  contract:
    runs-on: ubuntu-latest
    needs: [laravel, node]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: docker compose up --build -d --wait
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:contracts
      - run: pnpm test:contract --backend=laravel
      - run: pnpm test:contract --backend=nest
      - run: pnpm test:contract --backend=nest --base-url=http://localhost:8080/api/nest/v1
      - if: failure()
        run: docker compose logs --no-color
