name: worknoon-refund-assistant

# Everything has a working default, so `docker compose up --build` needs no .env. The defaults are
# demo defaults (DEMO_MODE=true, well-known admin token); see README "Running outside a demo".

x-api-env: &api-env
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  LLM_MODEL: ${LLM_MODEL:-claude-haiku-4-5}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LLM_MAX_CALLS_PER_HOUR: ${LLM_MAX_CALLS_PER_HOUR:-1000}
  DEMO_MODE: ${DEMO_MODE:-true}
  ADMIN_TOKEN: ${ADMIN_TOKEN:-demo-admin}
  CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
  # Only the web container's nginx may set X-Forwarded-For; everyone else is keyed by socket address.
  TRUSTED_PROXIES: 172.28.0.10
  RATE_LIMIT_VERIFY_PER_MINUTE: ${RATE_LIMIT_VERIFY_PER_MINUTE:-60}
  RATE_LIMIT_MESSAGES_PER_MINUTE: ${RATE_LIMIT_MESSAGES_PER_MINUTE:-60}
  RATE_LIMIT_ADMIN_FAILURES_PER_MINUTE: ${RATE_LIMIT_ADMIN_FAILURES_PER_MINUTE:-20}
  MAX_CONVERSATIONS_PER_ORDER_PER_DAY: ${MAX_CONVERSATIONS_PER_ORDER_PER_DAY:-20}
  CONTRACTS_PATH: /srv/contracts
  POLICY_DOC_PATH: /srv/policy/refund-policy.md

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: refunds
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-refunds}
      POSTGRES_DB: refunds_laravel
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-refunds_app}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    # Published on localhost only, for local development and the backends' test suites.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refunds -d refunds_laravel && psql -U refunds -d refunds_nest -c 'select 1' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30

  api-laravel:
    build:
      context: .
      dockerfile: apps/api-laravel/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-env
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${LARAVEL_APP_KEY:-}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: refunds_laravel
      DB_USERNAME: refunds_app
      DB_PASSWORD: ${APP_DB_PASSWORD:-refunds_app}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3002:3002"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/api/v1/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  api-nest:
    build:
      context: .
      dockerfile: apps/api-nest/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-env
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://refunds_app:${APP_DB_PASSWORD:-refunds_app}@db:5432/refunds_nest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/v1/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api-laravel:
        condition: service_healthy
      api-nest:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.28.0.10
    ports:
      - "8080:80"

volumes:
  db-data:
