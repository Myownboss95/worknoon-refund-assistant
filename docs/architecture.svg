<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .accent { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.5; }
      .soft { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.2; }
      .warn { fill: #fff7ed; stroke: #f59e0b; stroke-width: 1.5; }
      .ok { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .label { font-size: 13px; fill: #334155; }
      .small { font-size: 11.5px; fill: #64748b; }
      .step { font-size: 12px; fill: #1e293b; }
      .line { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #94a3b8; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f1f5f9"/>
  <text x="40" y="44" font-size="22" font-weight="800" fill="#0f172a">Worknoon Refund Assistant</text>
  <text x="40" y="68" class="label">Rules decide. AI understands and explains. Two interchangeable backends behind one contract.</text>

  <!-- Browser -->
  <rect x="40" y="100" width="250" height="150" rx="12" class="box"/>
  <text x="60" y="130" class="title">React web app</text>
  <text x="60" y="154" class="label">Customer chat · Admin queue</text>
  <text x="60" y="174" class="label">Decision trace drawer · Policy</text>
  <text x="60" y="200" class="small">React 19 · TanStack Query</text>
  <text x="60" y="218" class="small">Zod-parsed responses</text>
  <text x="60" y="236" class="small">backend switcher</text>

  <!-- nginx -->
  <rect x="40" y="300" width="250" height="110" rx="12" class="box"/>
  <text x="60" y="330" class="title">nginx (web :8080)</text>
  <text x="60" y="354" class="label">/api/laravel/v1 → api-laravel</text>
  <text x="60" y="374" class="label">/api/nest/v1 → api-nest</text>
  <text x="60" y="396" class="small">static SPA · security headers</text>
  <path d="M165 250 L165 296" class="line"/>

  <!-- Contracts -->
  <rect x="40" y="460" width="250" height="260" rx="12" class="accent"/>
  <text x="60" y="490" class="title">contracts/</text>
  <text x="60" y="512" class="small">single source of truth, read at boot</text>
  <text x="60" y="540" class="label">openapi.yaml</text>
  <text x="60" y="562" class="label">policy.config.json</text>
  <text x="60" y="584" class="label">scenarios.json (seed)</text>
  <text x="60" y="606" class="label">mock-llm-fixtures.json</text>
  <text x="60" y="628" class="label">injection-patterns.json</text>
  <text x="60" y="650" class="label">reply-guard.json · templates</text>
  <text x="60" y="672" class="label">prompts/extract.v1 · compose.v1</text>
  <text x="60" y="700" class="small">+ tests/contract runs against both</text>

  <!-- Backend container -->
  <rect x="340" y="100" width="540" height="620" rx="14" class="soft"/>
  <text x="362" y="130" class="title">API: Laravel 13 (:3002)  ≡  NestJS 12 (:3001)</text>
  <text x="362" y="152" class="small">Same routes, pipeline, policy and errors. The contract suite proves parity.</text>
  <path d="M290 355 L336 355" class="line"/>
  <path d="M290 590 L336 590" class="dash"/>

  <!-- Pipeline steps -->
  <g>
    <rect x="362" y="172" width="496" height="40" rx="8" class="box"/>
    <text x="378" y="197" class="step"><tspan font-weight="700">1 Verify</tspan>  email + order number → generic failure, rate limited</text>

    <rect x="362" y="220" width="496" height="40" rx="8" class="box"/>
    <text x="378" y="245" class="step"><tspan font-weight="700">2 Validate</tspan>  items belong to order · 1,000 chars · control chars stripped</text>

    <rect x="362" y="268" width="496" height="40" rx="8" class="warn"/>
    <text x="378" y="293" class="step"><tspan font-weight="700">3 Heuristic injection detector</tspan>  independent of the model</text>

    <rect x="362" y="316" width="496" height="52" rx="8" class="accent"/>
    <text x="378" y="338" class="step"><tspan font-weight="700">4 AI extract</tspan>  enum-only structured output, temperature 0</text>
    <text x="378" y="356" class="small">reason · conflict · injection · confidence. Never an amount or decision</text>

    <rect x="362" y="376" width="496" height="40" rx="8" class="box"/>
    <text x="378" y="401" class="step"><tspan font-weight="700">5 Clarify</tspan>  unclear → one follow-up; second unclear → escalate</text>

    <rect x="362" y="424" width="496" height="64" rx="8" class="ok"/>
    <text x="378" y="447" class="step"><tspan font-weight="700">6 Policy engine (pure code)</tspan>  R01…R10 over database facts</text>
    <text x="378" y="466" class="small">deny &gt; escalate &gt; approve · amount from DB only · thresholds from config</text>
    <text x="378" y="481" class="small">anything odd, including AI failure, fails safe to Escalated</text>

    <rect x="362" y="496" width="496" height="40" rx="8" class="accent"/>
    <text x="378" y="521" class="step"><tspan font-weight="700">7 AI compose</tspan>  empathetic reply for the decision already made</text>

    <rect x="362" y="544" width="496" height="40" rx="8" class="warn"/>
    <text x="378" y="569" class="step"><tspan font-weight="700">8 Reply guard</tspan>  contradiction · leaks · amount · length → template</text>

    <rect x="362" y="592" width="496" height="40" rx="8" class="box"/>
    <text x="378" y="617" class="step"><tspan font-weight="700">9 Persist + audit</tspan>  request, full decision trace, audit event</text>

    <rect x="362" y="640" width="496" height="40" rx="8" class="box"/>
    <text x="378" y="665" class="step"><tspan font-weight="700">10 Human review</tspan>  escalated queue · approve/deny with a note</text>
  </g>

  <!-- AI provider -->
  <rect x="930" y="250" width="230" height="170" rx="12" class="accent"/>
  <text x="950" y="280" class="title">RefundAnalyzer</text>
  <text x="950" y="304" class="label">extract() · compose()</text>
  <text x="950" y="332" class="label">Claude (claude-haiku-4-5)</text>
  <text x="950" y="352" class="small">laravel/ai · @anthropic-ai/sdk</text>
  <text x="950" y="378" class="label">Mock (no API key)</text>
  <text x="950" y="398" class="small">fixtures, identical in both</text>
  <path d="M858 342 L926 342" class="line"/>
  <path d="M858 516 C 900 516, 900 400, 926 390" class="line"/>

  <!-- Database -->
  <rect x="930" y="500" width="230" height="140" rx="12" class="box"/>
  <text x="950" y="530" class="title">PostgreSQL 17</text>
  <text x="950" y="554" class="label">refunds_laravel</text>
  <text x="950" y="574" class="label">refunds_nest</text>
  <text x="950" y="600" class="small">Eloquent · Prisma</text>
  <text x="950" y="618" class="small">integer cents · UTC</text>
  <path d="M858 612 L926 590" class="line"/>

  <text x="930" y="700" class="small">No tool calling: the model cannot</text>
  <text x="930" y="716" class="small">read or change data. Zero blast radius.</text>
</svg>
