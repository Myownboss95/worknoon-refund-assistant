# Global per-IP ceiling in front of both APIs, on top of the per-route limits inside each backend.
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Re-resolve service names through Docker's DNS so a restarted API container (new IP) keeps working
    # without restarting nginx. Using variables in proxy_pass is what makes nginx resolve at request time.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $laravel_upstream http://api-laravel:3002;
    set $nest_upstream http://api-nest:3001;

    # /api/laravel/v1/... -> api-laravel:3002/api/v1/...
    # X-Forwarded-For is overwritten, never appended, so clients cannot inject their own address.
    location /api/laravel/ {
        limit_req zone=api burst=100 nodelay;
        rewrite ^/api/laravel/(.*)$ /api/$1 break;
        proxy_pass $laravel_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }

    location /api/nest/ {
        limit_req zone=api burst=100 nodelay;
        rewrite ^/api/nest/(.*)$ /api/$1 break;
        proxy_pass $nest_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }

    # Rate-limited API calls get the same JSON error shape the backends use.
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Please wait a moment and try again."}}';
    }

    location / {
        try_files $uri /index.html;
    }
}
